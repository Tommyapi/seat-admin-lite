name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, openssl
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # PHP tests write examples/fixture.json, which the JS verifier test reads.
      - run: php tests/run.php
      - run: node examples/verify.test.mjs
